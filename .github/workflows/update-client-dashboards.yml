name: Update client dashboards

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pull latest KPI data from ClickUp
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: node scripts/sync-clickup.mjs

      - name: Publish changed dashboard data
        run: |
          DATA_FILE="projects/pandrol-sara-2026/data/project.json"
          cp "$DATA_FILE" /tmp/pandrol-project.json

          git config user.name "OptiStrat Dashboard Bot"
          git config user.email "dashboard-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pandrol-project.json "$DATA_FILE"

            if git diff --quiet -- "$DATA_FILE"; then
              echo "No dashboard data changed."
              exit 0
            fi

            git add "$DATA_FILE"
            git commit -m "chore: refresh Pandrol dashboard data"

            if git push origin HEAD:main; then
              echo "Dashboard data published successfully."
              exit 0
            fi

            echo "Main changed during publish; retrying with the latest version."
          done

          echo "Dashboard publish failed after three attempts."
          exit 1
